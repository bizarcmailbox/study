1FMy4xMDBVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//NkxHwAAANIAAAAAFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV"};
</script>
<script>
"use strict";
const LS_MISSED = 'zhvocab_missed', LS_HIST = 'zhvocab_history';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const BYID = {}; POOL.concat(NEW, REVIEW).forEach((w) => { BYID[w.id] = Object.assign({}, BYID[w.id] || {}, w); });
let current = null;
// speak: embedded edge-tts mp3 first; if missing or blocked, the browser's zh-CN voice (speechSynthesis)
function speakTTS(text) {
  try {
    if (!('speechSynthesis' in window) || !text) return null;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = 'zh-CN'; u.rate = 0.85;
    const v = speechSynthesis.getVoices().find((x) => /zh[-_]CN/i.test(x.lang)) || speechSynthesis.getVoices().find((x) => /^zh/i.test(x.lang));
    if (v) u.voice = v;
    speechSynthesis.speak(u); return u;
  } catch (e) { return null; }
}
function play(key) {
  const id = parseInt(key, 10), w = BYID[id] || {};
  const text = key.endsWith('e') ? w.example_zh : w.word;
  if (current) { try { current.pause(); } catch (e) {} }
  const src = AUDIO[key];
  if (!src) { speakTTS(text); return null; }
  current = new Audio('data:audio/mpeg;base64,' + src);
  const p = current.play(); if (p && p.catch) p.catch(() => speakTTS(text));
  return current;
}
function loadLS(k, d) { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } }
function saveLS(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function hl(w) { return esc(w.example_zh).split(esc(w.word)).join(`<b>${esc(w.word)}</b>`); }

function renderCards() {
  $('cards').innerHTML = NEW.map((w, i) => `
  <div class="card" id="c${w.id}" onclick="if(!event.target.closest('button'))this.classList.toggle('open')">
    <div class="top">
      <div><span class="no">#${i + 1} · No.${w.id}</span><span class="lv">${esc(w.level)}</span>
        <div class="word zh">${esc(w.word)}</div>
        <div class="back-p"><span class="py">${esc(w.pinyin)}</span><span class="hg">[${esc(w.hangul)}]</span></div></div>
      <button class="play" onclick="play('${w.id}w')">🔊 단어</button>
    </div>
    <div class="back-m"><span class="pos">${esc(w.pos)}</span><span class="mean">${esc(w.meaning_ko)}</span></div>
    <div class="ex">
      <div class="top"><div class="s zh">${hl(w)}</div><button class="play" onclick="play('${w.id}e')">🔊 예문</button></div>
      <div class="p back-p">${esc(w.example_py)}</div>
      <div class="ko back-m">→ ${esc(w.example_ko)}</div>
    </div>
  </div>`).join('');
}
let hideM = false, hideP = false;
function applyHide() {
  document.body.classList.toggle('hideM', hideM); document.body.classList.toggle('hideP', hideP);
  document.querySelectorAll('.card.open').forEach((c) => c.classList.remove('open'));
  $('toggleM').textContent = hideM ? '👀 뜻 보이기' : '🙈 뜻 가리기'; $('toggleM').classList.toggle('on', hideM);
  $('toggleP').textContent = hideP ? '👀 병음 보이기' : '🔤 병음 가리기'; $('toggleP').classList.toggle('on', hideP);
}
$('toggleM').onclick = () => { hideM = !hideM; applyHide(); };
$('toggleP').onclick = () => { hideP = !hideP; applyHide(); };
let playing = false;
$('playAll').onclick = async () => {
  if (playing) { playing = false; if (current) current.pause(); $('playAll').textContent = '▶️ 단어 전체 듣기'; return; }
  playing = true; $('playAll').textContent = '⏹ 멈추기';
  for (const w of NEW) {
    if (!playing) break;
    const card = $('c' + w.id); if (card) card.scrollIntoView({behavior: 'smooth', block: 'center'});
    const a = play(w.id + 'w');
    await new Promise((r) => { if (a) { a.onended = r; a.onerror = r; } setTimeout(r, a ? 6000 : 1800); });
    await new Promise((r) => setTimeout(r, 900));
  }
  playing = false; $('playAll').textContent = '▶️ 단어 전체 듣기';
};
function showTab(t) {
  $('study').classList.toggle('hidden', t !== 'study');
  $('quiz').classList.toggle('hidden', t !== 'quiz');
  $('tabStudy').classList.toggle('primary', t === 'study');
  $('tabQuiz').classList.toggle('primary', t === 'quiz');
  window.scrollTo(0, 0);
}
$('tabStudy').onclick = () => showTab('study');
$('tabQuiz').onclick = () => { if (!questions.length) startQuiz(); else showTab('quiz'); };
$('goQuiz').onclick = () => startQuiz();

// ---------- quiz ----------
const TYPES = {
  zh2ko: '① 汉字 → 뜻 고르기',
  ko2zh: '② 뜻 → 汉字 고르기',
  tone: '③ 병음·성조 고르기',
  listen: '④ 듣기: 소리를 듣고 汉字 고르기',
  cloze: '⑤ 예문 빈칸 채우기',
};
function distractors(w, field, n) {
  const len = (p) => String(p[field]).length;
  const near = (p) => field === 'meaning_ko' || Math.abs(len(p) - len(w)) <= (field === 'word' || field === 'cloze_answer' ? 0 : 1);
  const tiers = [
    POOL.filter((p) => p.pos === w.pos && near(p)),
    POOL.filter((p) => near(p)),
    POOL];
  const out = []; const seen = new Set([w[field]]);
  for (const tier of tiers) for (const p of shuffle(tier)) {
    if (out.length >= n) break;
    if (p.id === w.id || !p[field] || seen.has(p[field])) continue;
    seen.add(p[field]); out.push(p[field]);
  }
  return out;
}
function makeQ(w, type, tag) {
  w = Object.assign({}, BYID[w.id] || {}, w);
  let prompt, field, opts;
  if (type === 'zh2ko') { prompt = w.word; field = 'meaning_ko'; }
  else if (type === 'ko2zh') { prompt = w.meaning_ko; field = 'word'; }
  else if (type === 'listen') { prompt = '🔊'; field = 'word'; }
  else if (type === 'cloze') { prompt = w.example_cloze; field = 'cloze_answer'; }
  else { prompt = w.word; field = 'pinyin'; }
  const answer = w[field];
  if (type === 'tone') opts = shuffle([answer].concat((w.tone_opts || []).filter((x) => x !== answer).slice(0, 3)));
  else opts = shuffle([answer].concat(distractors(w, field, 3)));
  return {w, type, tag, prompt, answer, opts};
}
function buildQuestions(extraMissed) {
  const qs = [];
  const cycle = ['zh2ko', 'tone', 'cloze', 'ko2zh', 'listen'];
  shuffle(NEW).forEach((w, i) => {
    let t = cycle[i % cycle.length];
    if (t === 'cloze' && !w.example_cloze) t = 'zh2ko';
    qs.push(makeQ(w, t, '새 단어'));
  });
  const revTypes = ['zh2ko', 'ko2zh', 'tone', 'listen', 'cloze'];
  REVIEW.forEach((w) => qs.push(makeQ(w, revTypes[Math.floor(Math.random() * revTypes.length)], `복습 · Day ${w.day}`)));
  const missTypes = ['zh2ko', 'ko2zh', 'tone'];
  (extraMissed || []).forEach((w, i) => qs.push(makeQ(w, missTypes[i % 3], '오답 복습')));
  return shuffle(qs);
}
let questions = [], qi = 0, score = 0, missed = [], answered = false;
function missedFromStorage() {
  const m = loadLS(LS_MISSED, {});
  const inToday = new Set(NEW.map((w) => w.id).concat(REVIEW.map((w) => w.id)));
  return Object.values(m).filter((x) => x && x.w && !inToday.has(x.w.id) && BYID[x.w.id])
    .sort((a, b) => b.count - a.count).slice(0, 10).map((x) => BYID[x.w.id]);
}
function startQuiz(list) {
  questions = list || buildQuestions(missedFromStorage());
  qi = 0; score = 0; missed = [];
  showTab('quiz'); renderQ();
}
function renderQ() {
  if (qi >= questions.length) return finish();
  answered = false;
  const q = questions[qi];
  $('qinfo').textContent = `${qi + 1} / ${questions.length} · ${TYPES[q.type]} · ${q.tag}`;
  $('bar').style.width = (qi / questions.length * 100) + '%';
  let head = '';
  if (q.type === 'listen') head = `<div class="qtext"><button class="primary" style="font-size:22px;padding:14px 28px" onclick="play('${q.w.id}w')">🔊 다시 듣기</button></div>`;
  else head = `<div class="qtext ${q.type === 'zh2ko' || q.type === 'tone' ? 'zh' : 'small' + (q.type === 'cloze' ? ' zh' : '')}">${esc(q.prompt)}</div>`;
  if (q.type === 'cloze') head += `<div><small class="mut">${esc(q.w.example_ko)}</small></div>`;
  if (q.type === 'tone') head += `<div><small class="mut">뜻: ${esc(q.w.meaning_ko)}</small></div>`;
  const zhOpts = ['ko2zh', 'listen', 'cloze'].includes(q.type) ? ' class="zh"' : '';
  $('qbody').innerHTML = head + '<div class="opts">' + q.opts.map((o, i) => `<button${zhOpts} data-i="${i}">${esc(o)}</button>`).join('') + '</div><div class="fb" id="fb"></div>';
  $('qbody').querySelectorAll('.opts button').forEach((b) => b.onclick = () => choose(b, q));
  if (q.type === 'listen') setTimeout(() => play(q.w.id + 'w'), 250);
}
function choose(btn, q) {
  if (answered) return; answered = true;
  const ok = btn.textContent === q.answer;
  $('qbody').querySelectorAll('.opts button').forEach((b) => { if (b.textContent === q.answer) b.classList.add('ok'); });
  const m = loadLS(LS_MISSED, {});
  if (ok) { score++; if (m[q.w.id]) { m[q.w.id].streak = (m[q.w.id].streak || 0) + 1; if (m[q.w.id].streak >= 2) delete m[q.w.id]; } }
  else {
    btn.classList.add('bad');
    if (!missed.some((x) => x.id === q.w.id)) missed.push(q.w);
    const e = m[q.w.id] || {w: {id: q.w.id, word: q.w.word}, count: 0};
    e.w = {id: q.w.id, word: q.w.word}; e.count++; e.streak = 0; e.lastDay = DAY; m[q.w.id] = e;
  }
  saveLS(LS_MISSED, m);
  const w = q.w;
  $('fb').innerHTML = `${ok ? '⭕ <b style="color:var(--ok)">정답!</b>' : '❌ <b style="color:var(--bad)">아쉬워요</b>'}<br>
    <b class="zh" style="font-size:22px">${esc(w.word)}</b> <span class="py">${esc(w.pinyin)}</span> [${esc(w.hangul)}] — ${esc(w.meaning_ko)}
    ${w.example_zh ? `<br><span class="zh">${esc(w.example_zh)}</span><br><small class="mut">${esc(w.example_py)}<br>→ ${esc(w.example_ko)}</small>` : ''}
    <div style="display:flex;gap:8px;margin-top:10px"><button onclick="play('${w.id}w')">🔊 단어</button><button onclick="play('${w.id}e')">🔊 예문</button>
    <button class="primary" style="flex:1" id="next">다음 →</button></div>`;
  play(w.id + 'w');
  $('next').onclick = () => { qi++; renderQ(); };
}
function finish() {
  $('bar').style.width = '100%';
  const total = questions.length, pct = Math.round(score / total * 100);
  const hist = loadLS(LS_HIST, {}); hist['day' + DAY] = {score, total, at: new Date().toISOString()}; saveLS(LS_HIST, hist);
  const allMissed = Object.values(loadLS(LS_MISSED, {}));
  $('qinfo').textContent = '결과';
  $('qbody').innerHTML = `<div class="res"><div class="score">${score} / ${total}</div><div>${pct}% ${pct >= 90 ? '🎉 훌륭해요!' : pct >= 70 ? '👍 잘했어요!' : '💪 틀린 단어만 한 번 더 해 봐요!'}</div></div>
    <h3>틀린 단어 (${missed.length})</h3>
    <ul class="miss">${missed.map((w) => `<li><button class="play" onclick="play('${w.id}w')">🔊</button> <b class="zh">${esc(w.word)}</b> <span class="py">${esc(w.pinyin)}</span> [${esc(w.hangul)}] — ${esc(w.meaning_ko)}</li>`).join('') || '<li>없어요! 완벽해요 ✨</li>'}</ul>
    <p><small class="mut">누적 오답 노트: ${allMissed.length}개 (이 기기 브라우저에 저장, 두 번 연속 맞히면 자동 삭제)</small></p>
    <div style="display:grid;gap:8px">
      ${missed.length ? '<button class="primary" id="retry">틀린 단어만 다시 풀기</button>' : ''}
      <button id="again">처음부터 다시 풀기</button>
      <button onclick="showTab('study')">📖 단어 카드로 돌아가기</button>
    </div>`;
  if (missed.length) $('retry').onclick = () => startQuiz(shuffle(missed.map((w, i) => makeQ(w, ['zh2ko', 'ko2zh', 'tone', 'listen'][i % 4], '다시 풀기'))));
  $('again').onclick = () => startQuiz();
}
$('newCount').textContent = NEW.length;
$('revCount').textContent = REVIEW.length; if (!REVIEW.length) $('revWrap').textContent = '';
renderCards();
if (location.hash === '#quiz') startQuiz();
if ('speechSynthesis' in window) { try { speechSynthesis.getVoices(); } catch (e) {} }
</script>

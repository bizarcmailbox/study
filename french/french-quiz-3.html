12", "song": 6, "fr": "J'ai peur.", "pr": "제 푀르", "ko": "무서워요 (겁나요)", "tip": "avoir peur = 무섭다 (être가 아니라 avoir!). ~이 무서우면 J'ai peur de ~ (예: J'ai peur des chiens, 개가 무서워요).", "sit": "천둥이 크게 치거나 공포 영화를 볼 때 '무서워!'라고 할 때", "cl": "J'ai ＿＿, je m'inquiète pour demain,", "clko": "무서워요, 내일이 걱정돼요,", "ans": "peur", "wrong": ["faim", "hâte", "soif"], "k": "37bed1da25"}, {"id": "m13", "song": 6, "fr": "Je m'inquiète.", "pr": "주 맹키에트", "ko": "걱정돼요", "tip": "~이 걱정되면 Je m'inquiète pour ~ (푸르). 예: Je m'inquiète pour toi (네가 걱정돼).", "sit": "밤늦게까지 아이가 집에 안 들어와서 걱정될 때", "cl": "J'ai peur, je m'＿＿ pour demain,", "clko": "무서워요, 내일이 걱정돼요,", "ans": "inquiète", "wrong": ["appelle", "excuse", "amuse"], "k": "30dcc24648"}, {"id": "m14", "song": 6, "fr": "Ne t'inquiète pas !", "pr": "느 탱키에트 파", "ko": "걱정하지 마!", "tip": "존댓말은 Ne vous inquiétez pas ! (느 부 쟁키에테 파). 말할 때는 ne를 빼고 T'inquiète ! (탱키에트)라고 짧게도 해요.", "sit": "걱정하는 친구를 '걱정하지 마'라고 안심시킬 때", "cl": "Tu me dis : ne t'＿＿ pas !", "clko": "네가 말해 줘요: 걱정하지 마!", "ans": "inquiète", "wrong": ["excuse", "en va", "arrête"], "k": "3638b0891d"}, {"id": "m15", "song": 6, "fr": "Courage !", "pr": "쿠라주", "ko": "힘내! 파이팅!", "tip": "한국어 '파이팅!'에 딱 맞는 말이에요. 더 다정하게 Bon courage ! (봉 쿠라주, 힘내세요!)라고도 해요.", "sit": "시험을 앞두고 긴장한 친구에게 '힘내!'라고 할 때", "cl": "＿＿ ! Je suis là pour toi,", "clko": "힘내! 내가 네 곁에 있잖아,", "ans": "Courage", "wrong": ["Pardon", "Bonsoir", "Attention"], "k": "0082422ddb"}, {"id": "m16", "song": 6, "fr": "Je suis là pour toi.", "pr": "주 쉬 라 푸르 투아", "ko": "내가 네 곁에 있어 (내가 있잖아)", "tip": "là (라) = 거기, 여기. 힘들 때 기댈 수 있다는 위로의 말이에요. 존댓말은 Je suis là pour vous (푸르 부).", "sit": "힘든 일을 겪는 친구에게 '내가 곁에 있을게'라고 위로할 때", "cl": "Courage ! Je suis ＿＿ pour toi,", "clko": "힘내! 내가 네 곁에 있잖아,", "ans": "là", "wrong": ["loin", "perdu", "en retard"], "k": "25965ab4fe"}, {"id": "m17", "song": 6, "fr": "Tout ira bien.", "pr": "투 티라 비앵", "ko": "다 잘될 거야", "tip": "ira는 aller(가다)의 미래형이에요. tout + ira가 이어져 '투 티라'로 들려요. 지금 괜찮다는 Tout va bien (투 바 비앵)과 비교해 보세요.", "sit": "수술을 앞둔 가족에게 '다 잘될 거예요'  const hist=loadLS(LS_HIST,[]);hist.push({score,total,at:new Date().toISOString()});saveLS(LS_HIST,hist.slice(-50));
 const all=missedList();$('qinfo').textContent='결과';
 $('qbody').innerHTML=`<div class="res"><div class="score">${score} / ${total}</div><div>${pct}% ${pct>=90?'🎉 훌륭해요! C\'est parfait !':pct>=70?'👍 잘했어요!':'💪 틀린 표현만 한 번 더 해 봐요!'}</div></div>
  <h3>틀린 표현 (${missed.length})</h3><ul class="miss">${missed.map((e)=>`<li><button class="play" onclick="play('${e.id}')">🔊</button> <b>${esc(e.fr)}</b> <span class="pr">[${esc(e.pr)}]</span> — ${esc(e.ko)}</li>`).join('')||'<li>없어요! 완벽해요 ✨</li>'}</ul>
  <p><small class="mut">누적 오답 노트: ${all.length}개 (이 기기 브라우저에 저장, 두 번 연속 맞히면 자동 삭제)</small></p>
  <div style="display:grid;gap:8px">${missed.length?'<button class="primary" id="retry">틀린 표현만 다시 풀기</button>':''}<button id="again">처음부터 다시 풀기 (새로 섞기)</button><button onclick="showTab('study')">📖 표현 카드로 돌아가기</button></div>`;
 if(missed.length)$('retry').onclick=()=>startQuiz(shuffle(missed.map((e,i)=>makeQ(e,['fr2ko','ko2fr','sit','listen','cloze'][i%5],'다시 풀기'))));
 $('again').onclick=()=>startQuiz();}
$('nExpr').textContent=EXPR.length;renderCards();updMiss();
if(location.hash==='#quiz')startQuiz();
if('speechSynthesis' in window){try{speechSynthesis.getVoices();}catch(e){}}

<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>프랑스어 표현 퀴즈 — 길거리 · 레스토랑</title><style>:root{--bg:#f6f7fb;--card:#fff;--ink:#1d2433;--sub:#667085;--acc:#1c4fd8;--red:#d6336c;--gold:#f59f00;--ok:#2f9e44;--bad:#e03131;--line:#e4e7ef}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-text-size-adjust:100%}
header{background:linear-gradient(135deg,#1c4fd8 0%,#1c4fd8 33%,#8f9bb3 50%,#e03131 67%,#e03131 100%);color:#fff;padding:20px 16px 16px;text-shadow:0 1px 2px rgba(0,0,0,.25)}
header h1{margin:0;font-size:22px}header p{margin:4px 0 0;opacity:.95;font-size:14px}
nav{position:sticky;top:0;z-index:5;display:flex;gap:8px;padding:10px 12px;background:rgba(246,247,251,.95);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
nav button{flex:1}
main{max-width:760px;margin:0 auto;padding:12px}
button{font:inherit;color:inherit;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.on{background:#fff4e6;border-color:var(--gold)}
button:active{transform:scale(.98)}
.tip{background:#fff9db;border:1px solid #ffe066;border-radius:12px;padding:12px;font-size:14px;margin-bottom:12px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.fr{font-size:19px;font-weight:700;word-break:keep-all}
.pr{font-size:15px;color:var(--red);font-weight:600}
.ko{font-size:15px;color:#344054}
.play{border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap;flex:none}
.hideM .back-m,.hideP .back-p{filter:blur(7px);-webkit-filter:blur(7px);user-select:none}
.card.open .back-m,.card.open .back-p{filter:none;-webkit-filter:none}
.hidden{display:none}small.mut{color:var(--sub)}
.badge{font-size:11px;background:#edf2ff;color:var(--acc);border-radius:6px;padding:1px 6px;margin-right:4px}
.tipline{font-size:13px;color:#5c5f66;margin-top:4px;border-top:1px dashed var(--line);padding-top:6px}

.qbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.prog{height:8px;background:#eceae4;border-radius:99px;overflow:hidden;margin:6px 0 12px}.prog div{height:100%;background:var(--acc);width:0;transition:width .2s}
.qtype{font-size:13px;color:var(--sub)}.qtext{font-size:26px;font-weight:700;margin:10px 0;word-break:keep-all}
.qtext.small{font-size:19px}
.opts{display:grid;gap:8px}.opts button{text-align:left;font-size:17px;padding:12px}
.opts button.ok{background:#ebfbee;border-color:var(--ok);color:#1b5e20}.opts button.bad{background:#fff5f5;border-color:var(--bad);color:#a51111}
.fb{margin-top:12px;font-size:15px}
.res{text-align:center}.score{font-size:44px;font-weight:800;color:var(--acc)}
.miss{text-align:left;padding-left:18px}.miss li{margin:6px 0}
.seg{display:flex;gap:6px;margin:8px 0}.seg button{flex:1;padding:8px;font-size:14px}

<script>
"use strict";
const LS_MISSED='frsong_missed',LS_HIST='frsong_history';
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BYID={};EXPR.forEach((e)=>BYID[e.id]=e);
const CONF={};CONFLICTS.forEach((g)=>g.forEach((a)=>{CONF[a]=(CONF[a]||new Set());g.forEach((b)=>CONF[a].add(b));}));
let current=null;
function speakTTS(t){try{if(!('speechSynthesis' in window)||!t)return null;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=0.85;const v=speechSynthesis.getVoices().find((x)=>/fr[-_]FR/i.test(x.lang))||speechSynthesis.getVoices().find((x)=>/^fr/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u);return u;}catch(e){return null;}}
function play(id){const e=BYID[id];if(!e)return null;if(current){try{current.pause();}catch(x){}}const src=AUDIO[e.k];if(!src){speakTTS(e.fr);return null;}current=new Audio('data:audio/mpeg;base64,'+src);const p=current.play();if(p&&p.catch)p.catch(()=>speakTTS(e.fr));return current;}
function loadLS(k,d){try{return JSON.parse(localStorage.getItem(k))||d;}catch(e){return d;}}
function saveLS(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let filt=0;
function renderCards(){const list=EXPR.filter((e)=>!filt||e.song===filt);
 $('cards').innerHTML=list.map((e,i)=>`<div class="card" id="c${e.id}" onclick="if(!event.target.closest('button'))this.classList.toggle('open')"><div class="top"><div><span class="badge">${e.song===1?'🚶 길거리':'🍽️ 레스토랑'} ${i+1}</span><div class="fr" style="font-size:21px">${esc(e.fr)}</div><div class="pr back-p">[${esc(e.pr)}]</div><div class="ko back-m"><b>${esc(e.ko)}</b></div></div><button class="play" onclick="play('${e.id}')">🔊</button></div><div class="tipline back-m">💬 ${esc(e.tip)}</div></div>`).join('');
 [0,1,2].forEach((n)=>$('f'+n).classList.toggle('primary',n===filt));}
[0,1,2].forEach((n)=>$('f'+n).onclick=()=>{filt=n;renderCards();});
let hideM=false,hideP=false;
function applyHide(){document.body.classList.toggle('hideM',hideM);document.body.classList.toggle('hideP',hideP);document.querySelectorAll('.card.open').forEach((c)=>c.classList.remove('open'));
 $('toggleM').textContent=hideM?'👀 뜻 보이기':'🙈 뜻 가리기';$('toggleM').classList.toggle('on',hideM);$('toggleP').textContent=hideP?'👀 발음 보이기':'🙈 발음 가리기';$('toggleP').classList.toggle('on',hideP);}
$('toggleM').onclick=()=>{hideM=!hideM;applyHide();};$('toggleP').onclick=()=>{hideP=!hideP;applyHide();};
let playing=false;
$('playAll').onclick=async()=>{if(playing){playing=false;if(current)current.pause();$('playAll').textContent='▶️ 전체 듣기';return;}
 playing=true;$('playAll').textContent='⏹ 멈추기';
 for(const e of EXPR.filter((x)=>!filt||x.song===filt)){if(!playing)break;const c=$('c'+e.id);if(c)c.scrollIntoView({behavior:'smooth',block:'center'});const a=play(e.id);await new Promise((r)=>{if(a){a.onended=r;a.onerror=r;}setTimeout(r,a?8000:3000);});await new Promise((r)=>setTimeout(r,900));}
 playing=false;$('playAll').textContent='▶️ 전체 듣기';};
function showTab(t){$('study').classList.toggle('hidden',t!=='study');$('quiz').classList.toggle('hidden',t!=='quiz');$('tabStudy').classList.toggle('primary',t==='study');$('tabQuiz').classList.toggle('primary',t==='quiz');window.scrollTo(0,0);if(t==='study')updMiss();}
$('tabStudy').onclick=()=>showTab('study');$('tabQuiz').onclick=()=>{if(!questions.length)startQuiz();else showTab('quiz');};
$('goQuiz').onclick=()=>startQuiz();
$('goMissed').onclick=()=>{const m=missedList();if(!m.length){alert('오답 노트가 비어 있어요 ✨');return;}startQuiz(shuffle(m.map((e,i)=>makeQ(e,TYPESEQ[i%TYPESEQ.length],'오답 노트'))));};
function missedList(){return Object.keys(loadLS(LS_MISSED,{})).filter((id)=>BYID[id]).map((id)=>BYID[id]);}
function updMiss(){$('nMiss').textContent=missedList().length;}
// ---------- quiz ----------
const TYPES={fr2ko:'① 프랑스어 → 뜻 고르기',ko2fr:'② 뜻 → 프랑스어 고르기',listen:'③ 듣기: 듣고 프랑스어 고르기',cloze:'④ 가사 빈칸 채우기',sit:'⑤ 상황: 이럴 땐 뭐라고 말할까?'};
const TYPESEQ=['fr2ko','sit','cloze','ko2fr','listen'];
function others(e){const c=CONF[e.id]||new Set([e.id]);const ok=(p)=>p.id!==e.id&&!c.has(p.id);return shuffle(EXPR.filter((p)=>ok(p)&&p.song===e.song)).concat(shuffle(EXPR.filter((p)=>ok(p)&&p.song!==e.song)));}
function makeQ(e,type,tag){let prompt,answer,opts;
 if(type==='cloze'){prompt=e.cl;answer=e.ans;opts=shuffle([answer].concat(e.wrong.slice(0,3)));}
 else{const field=type==='fr2ko'?'ko':'fr';answer=e[field];const seen=new Set([answer]);const ds=[];for(const p of others(e)){if(ds.length>=3)break;if(seen.has(p[field]))continue;seen.add(p[field]);ds.push(p[field]);}opts=shuffle([answer].concat(ds));
  prompt=type==='fr2ko'?e.fr:type==='ko2fr'?e.ko:type==='sit'?e.sit:'🔊';}
 return {e,type,tag,prompt,answer,opts};}
function buildQuestions(){return shuffle(EXPR).map((e,i)=>makeQ(e,TYPESEQ[i%TYPESEQ.length],e.song===1?'🚶 길거리':'🍽️ 레스토랑'));}
let questions=[],qi=0,score=0,missed=[],answered=false;
function startQuiz(list){questions=list||buildQuestions();qi=0;score=0;missed=[];showTab('quiz');renderQ();}
function renderQ(){if(qi>=questions.length)return finish();answered=false;const q=questions[qi];
 $('qinfo').textContent=`${qi+1} / ${questions.length} · ${TYPES[q.type]} · ${q.tag}`;$('bar').style.width=(qi/questions.length*100)+'%';
 let head='';
 if(q.type==='listen')head=`<div class="qtext"><button class="primary" style="font-size:20px;padding:14px 26px" onclick="play('${q.e.id}')">🔊 다시 듣기</button></div>`;
 else if(q.type==='sit')head=`<div class="qtext small">🧭 ${esc(q.prompt)}</div><small class="mut">뭐라고 말하면 될까요?</small>`;
 else if(q.type==='cloze')head=`<div class="qtext small">🎵 ${esc(q.prompt)}</div><small class="mut">뜻: ${esc(q.e.clko)}</small>`;
 else head=`<div class="qtext${q.type==='ko2fr'?' small':''}">${esc(q.prompt)}</div>`;
 $('qbody').innerHTML=head+'<div class="opts">'+q.opts.map((o,i)=>`<button data-i="${i}">${esc(o)}</button>`).join('')+'</div><div class="fb" id="fb"></div>';
 $('qbody').querySelectorAll('.opts button').forEach((b)=>b.onclick=()=>choose(b,q));
 if(q.type==='listen')setTimeout(()=>play(q.e.id),250);}
function choose(btn,q){if(answered)return;answered=true;const pick=q.opts[+btn.dataset.i];const ok=pick===q.answer;
 $('qbody').querySelectorAll('.opts button').forEach((b)=>{if(q.opts[+b.dataset.i]===q.answer)b.classList.add('ok');});
 const m=loadLS(LS_MISSED,{});
 if(ok){score++;if(m[q.e.id]){m[q.e.id].streak=(m[q.e.id].streak||0)+1;if(m[q.e.id].streak>=2)delete m[q.e.id];}}
 else{btn.classList.add('bad');if(!missed.some((x)=>x.id===q.e.id))missed.push(q.e);const x=m[q.e.id]||{fr:q.e.fr,count:0};x.count++;x.streak=0;x.at=new Date().toISOString();m[q.e.id]=x;}
 saveLS(LS_MISSED,m);const e=q.e;
 $('fb').innerHTML=`${ok?'⭕ <b style="color:var(--ok)">정답!</b>':'❌ <b style="color:var(--bad)">아쉬워요</b> — 정답: <b>'+esc(q.answer)+'</b>'}<br>
  <span class="fr">${esc(e.fr)}</span> <span class="pr">[${esc(e.pr)}]</span><br><b>${esc(e.ko)}</b><br><small class="mut">💬 ${esc(e.tip)}</small>
  <div style="display:flex;gap:8px;margin-top:10px"><button onclick="play('${e.id}')">🔊 듣기</button><button class="primary" style="flex:1" id="next">다음 →</button></div>`;
 play(e.id);$('next').onclick=()=>{qi++;renderQ();};}
function finish(){$('bar').style.width='100%';const total=questions.length,pct=Math.round(score/total*100);
 const hist=loadLS(LS_HIST,[]);hist.push({score,total,at:new Date().toISOString()});saveLS(LS_HIST,hist.slice(-50));
 const all=missedList();$('qinfo').textContent='결과';
 $('qbody').innerHTML=`<div class="res"><div class="score">${score} / ${total}</div><div>${pct}% ${pct>=90?'🎉 훌륭해요! 파리에서도 문제없어요!':pct>=70?'👍 잘했어요!':'💪 틀린 표현만 한 번 더 해 봐요!'}</div></div>
  <h3>틀린 표현 (${missed.length})</h3><ul class="miss">${missed.map((e)=>`<li><button class="play" onclick="play('${e.id}')">🔊</button> <b>${esc(e.fr)}</b> <span class="pr">[${esc(e.pr)}]</span> — ${esc(e.ko)}</li>`).join('')||'<li>없어요! 완벽해요 ✨</li>'}</ul>
  <p><small class="mut">누적 오답 노트: ${all.length}개 (이 기기 브라우저에 저장, 두 번 연속 맞히면 자동 삭제)</small></p>
  <div style="display:grid;gap:8px">${missed.length?'<button class="primary" id="retry">틀린 표현만 다시 풀기</button>':''}<button id="again">처음부터 다시 풀기 (새로 섞기)</button><button onclick="showTab('study')">📖 표현 카드로 돌아가기</button></div>`;
 if(missed.length)$('retry').onclick=()=>startQuiz(shuffle(missed.map((e,i)=>makeQ(e,['fr2ko','ko2fr','sit','listen','cloze'][i%5],'다시 풀기'))));
 $('again').onclick=()=>startQuiz();}
$('nExpr').textContent=EXPR.length;renderCards();updMiss();

if('speechSynthesis' in window){try{speechSynthesis.getVoices();}catch(e){}}
</script></body></html>

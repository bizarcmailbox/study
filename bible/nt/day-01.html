2–13).", "bsk": "https://www.bskorea.or.kr/bible/korbibReadpage.php?version=GAE&book=jhn&chap=1&sec=1", "choices": ["자녀", "제사장", "종", "백성"], "answer": 0, "gty": {"url": "https://www.gty.org/sermons/43-3/jesus-the-divine-light", "title": "Jesus: The Divine Light", "ref": "John 1:6–13"}}, {"id": 9, "type": "mc", "q": "요한복음 1:14에서 말씀은 무엇이 되어 우리 가운데 거하셨나요?", "ref": "요 1:14", "p": 1, "explain": "「말씀이 육신이 되어 우리 가운데 거하시매」 — 그 영광은 아버지의 독생자의 영광이요 은혜와 진리가 충만했습니다(요 1:14).", "bsk": "https://www.bskorea.or.kr/bible/korbibReadpage.php?version=GAE&book=jhn&chap=1&sec=1", "choices": ["천사", "성전", "육신", "율법"], "answer": 2, "gty": {"url": "https://www.gty.org/sermons/43-4/jesus-glory-grace-and-god", "title": "Jesus: Glory, Grace, and God", "ref": "John 1:14–18"}}, {"id": 10, "type": "mc", "q": "세례 요한은 자기 뒤에 오시는 이가 자기보다 앞선 이유를 무엇이라고 말하나요?", "ref": "요 1:15", "p": 1, "explain": "「내 뒤에 오시는 이가 나보다 앞선 것은 나보다 먼저 계심이라」(요 1:15). 영원 전부터 계신 분임을 증언한 것입니다.", "bsk": "https://www.bskorea.or.kr/bible/korbibReadpage.php?version=GAE&book=jhn&chap=1&sec=1", "choices": ["제사장 가문이기 때문", "더 많은 제자가 있기 때문", "자기보다 나이가 많기 때문", "자기보다 먼저 계셨기 때문"], "answer": 3, "gty": {"url": "https://www.gty.org/sermons/43-4/jesus-glory-grace-and-god", "title": "Jesus: Glory, Grace, and God", "ref": "John 1:14–18"}}, {"id": 11, "type": "mc", "q": "「율법은 모세로 말미암아 주어진 것이요」 은혜와 진리는 누구로 말미암아 왔나요?", "ref": "요 1:16–17", "p": 1, "explain": "우리는 그의 충만한 데서 「은혜 위에 은혜」를 받았고, 은혜와 진리는 예수 그리스도로 말미암아 왔습니다(요 1:16–17).", "bsk": "https://www.bskorea.or.kr/bible/korbibReadpage.php?version=GAE&book=jhn&chap=1&sec=1", "choices": ["예수 그리스도", "세례 요한", "다윗", "아브라함"], "answer": 0, "gty": {"url": "https://www.gty.org/sermons/43-4/jesus-glory-grace-and-god", "title": "Jesus: Glory, Grace, and God", "ref": "John 1:14–18"}}, {"id": 12, "type": "ox", "q": "요한복음 1:18은 모세가 하나님을 직접 보고 하나님을 나타냈다고 말한다.", "ref": "요 1:18", "p": 1, "explain": "「본래 하나님을 본 사람이 없으되」 아버지 품 속에 있는 독생하신 하나님이 나타내셨습니다(요 1:18).", "bsk": "https://www.bskorea.or.kr/bible/korbibReadpage.php?version=GAE&book=jhn&chap=1&sec=1", "choices": ["O", "X"], "answer": 1, "gty": {"url": "https://www.gty.org/sermons/43-4/jesus-glory-grace-and-god", "title": "Jesus: Glory, Grace, and God", "ref": "John 1:14–18"}}, {"id": 13, "type": "mc", "q": "마태복음은 예수 그리스도를 누구의 자손으로 소개하며 시작하나요?", "ref": "마 1:1", "p": 2, "explain": "「아브라함과 다윗의 자손 예수 그리스도의 계보라」(마 1:1). 언약의 약속을 이루실 왕이심을 보여 줍니다.", "bsk": "https://www.bskorea.or.kr/bible/korbibReadpage.php?version=GAE&book=mat&chap=1&sec=1", "choices": ["아담과 노아", "모세와 아론", "아브라함과 다윗", "이삭과 야곱"], "answer": 2, "gty": {"url": "https://www.gty.org/sermons/2180/the-gracious-king", "title": "The Gracious King", "ref": "Matthew 1:1–17"}}, {"id": 14, "type": "blank", "q": "유다는 ____에게서 베레스와 세라를 낳았습니다.", "ref": "마 1:2–3", "p": 2, "explain": "아브라함–이삭–야곱–유다로 이어지고, 유다는 다말에게서 베레스와 세라를 낳았습니다(마 1:2–3).", "bsk": "https://www.bskorea.or.kr/bible/korbibReadpage.php?version=GAE&book=mat&chap=1&sec=1", "choices": ["룻", "밧세바", "다말", "라합"], "answer": 2, "gty": {"url": "https://www.gty.org/sermons/2180/the-gracious-king", "title": "The Gracious King", "ref": "Matthew 1:1–17"}}, {"id": 15, "type": "mc", "q": "마태복음 계보에서 보아스는 룻에게서 누구를 낳았나요?", "ref": "마 1:4–5", "p": 2, "explain": "살몬은 라합에게서 보아스를, 보아스는 룻에게서 오벳을, 오벳은 이새를 낳았습니다(마 1:5). 4절은 람–아미나답–나손–살몬입니다.", "bsk": "https://www.bskorea.or.kr/bible/korbibReadpage.php?version=GAE&book=mat&chap=1&sec=1", "choices": ["이새", "나손", "오벳", "살몬"], "answer": 2, "gty": {"url": "https://www.gty.org/sermons/2180/the-gracious-king", "title": "The Gracious King", "ref": "Matthew 1:1–17"}}, {"id": 16, "type": "blank", "q": "다윗은 ____의 아내에게서 솔로몬을 낳았습니다.", "ref": "마 1:6", "p": 2, "explain": "「다윗은 우리야의 아내에게서 솔로몬을 낳고」(마 1:6). 이새가 다윗 왕을 낳은 것도 같은 절입니다.", "bsk": "https://www.bskorea.or.kr/bible/korbibReadpage.php?version=GAE&book=mat&chap=1&sec=1", "choices": ["우리야", "나단", "압살롬", "요압"], "answer": 0, "gty": {"url": "https://www.gty.org/sermons/2180/the-gracious-king", "title": "The Gracious King", "ref": "Matthew 1:1–17"}}, {"id": 17, "type": "mc", "q": "마태복음 계보에서 솔로몬 다음에 기록된 왕은 누구인가요?", "ref": "마 1:7–8", "p": 2, "explain": "솔로몬–르호보암–아비야–아사(7절), 아사–여호사밧–요람–웃시야(8절) 순서입니다.", "bsk": "https://www.bskorea.or.kr/bible/korbibReadpage.php?version=GAE&book=mat&chap=1&sec=1", "choices": ["여로보암", "아사", "웃시야", "르호보암"], "answer": 3, "gty": {"url": "https://www.gty.org/sermons/2180/the-gracious-king", "title": "The Gracious King", "ref": "Matthew 1:1–17"}}, {"id": 18, "type": "mc", "q": "마태복음 1:9에서 아하스가 낳은 왕은 누구인가요?", "ref": "마 1:9–10", "p": 2, "explain": "웃시야–요담–아하스–히스기야(9절), 히스기야–므낫세–아몬–요시야(10절) 순서입니다.", "bsk": "https://www.bskorea.or.kr/bible/korbibReadpage.php?version=GAE&book=mat&chap=1&sec=1", "choices": ["요담", "요시야", "히스기야", "므낫세"], "answer": 2, "gty": {"url": "https://www.gty.org/sermons/2180/the-gracious-king", "title": "The Gracious King", "ref": "Matthew 1:1–17"}}, {"id": 19, "type": "blank", "q": "바벨론으로 사로잡혀 간 후에 여고냐는 스알디엘을 낳고, 스알디엘은 ____을 낳았습니다.", "ref": "마 1:11–12", "p": 2, "explain": "요시야는 「바벨론으로 사로잡혀 갈 때에」 여고냐와 그 형제들을 낳았고, 그 후 스알디엘–스룹바벨로 이어집니다(마 1:11–12).", "bsk": "https://www.bskorea.or.kr/bible/korbibReadpage.php?version=GAE&book=mat&chap=1&sec=1", "choices": ["스룹바벨", "에스라", "느헤미야", "아비훗"], "answer": 0, "gty": {"url": "https://www.gty.org/sermons/2180/the-gracious-king", "title": "The Gracious King", "ref": "Matthew 1:1–17"}}, {"id": 20, "type": "mc", "q": "다음 중 마태복음 1:13–15의 계보에 나오지 않는 이름은?", "ref": "마 1:13–15", "p": 2, "explain": "13–15절: 스룹바벨–아비훗–엘리아김–아소르–사독–아킴–엘리웃–엘르아살–맛단–야곱. 므낫세는 10절의 왕입니다.", "bsk": "https://www.bskorea.or.kr/bible/korbibReadpage.php?version=GAE&book=mat&chap=1&sec=1", "choices": ["엘르아살", "아비훗", "므낫세", "사독"], "answer": 2, "gty": {"url": "https://www.gty.org/sermons/2180/the-gracious-king", "title": "The Gracious King", "ref": "Matthew 1:1–17"}}, {"id": 21, "type": "ox", "q": "마태는 예수께서 요셉에게서 나셨다고 기록한다.", "ref": "마 1:16", "p": 2, "explain": "마태는 표현을 바꾸어 「마리아에게서 그리스도라 칭하는 예수가 나시니라」고 기록합니다. 요셉은 「마리아의 남편」으로 소개됩니다(마 1:16).", "bsk": "https://www.bskorea.or.kr/bible/korbibReadpage.php?vers  했다"], "answer": 1, "gty": {"url": "https://www.gty.org/sermons/2181/the-virgin-birth", "title": "The Virgin Birth", "ref": "Matthew 1:18–25"}}, {"id": 71, "type": "blank", "q": "「이름을 예수라 하라 이는 그가 자기 백성을 그들의 ____에서 구원할 자이심이라」", "ref": "마 1:20–21", "p": 5, "explain": "주의 사자가 꿈에 나타나 「다윗의 자손 요셉아」 마리아를 데려오기를 무서워하지 말라고 했습니다(마 1:20–21).", "bsk": "https://www.bskorea.or.kr/bible/korbibReadpage.php?version=GAE&book=mat&chap=1&sec=1", "choices": ["가난", "로마", "원수", "죄"], "answer": 3, "gty": {"url": "https://www.gty.org/sermons/2181/the-virgin-birth", "title": "The Virgin Birth", "ref": "Matthew 1:18–25"}}, {"id": 72, "type": "mc", "q": "「임마누엘」은 번역하면 무슨 뜻인가요?", "ref": "마 1:22–23", "p": 5, "explain": "선지자(사 7:14)의 말씀을 이루려 하심이며, 임마누엘은 「하나님이 우리와 함께 계시다」는 뜻입니다(마 1:22–23).", "bsk": "https://www.bskorea.or.kr/bible/korbibReadpage.php?version=GAE&book=mat&chap=1&sec=1", "choices": ["여호와는 구원이시다", "하나님은 나의 왕이시다", "하나님이 우리와 함께 계시다", "평강의 왕"], "answer": 2, "gty": {"url": "https://www.gty.org/sermons/2181/the-virgin-birth", "title": "The Virgin Birth", "ref": "Matthew 1:18–25"}}, {"id": 73, "type": "ox", "q": "요셉은 잠에서 깨어 주의 사자의 분부대로 마리아를 데려왔으나 아들을 낳기까지 동침하지 않았고, 이름을 예수라 했다.", "ref": "마 1:24–25", "p": 5, "explain": "마 1:24–25. 요셉은 들은 말씀에 즉시 순종했습니다.", "bsk": "https://www.bskorea.or.kr/bible/korbibReadpage.php?version=GAE&book=mat&chap=1&sec=1", "choices": ["O", "X"], "answer": 0, "gty": {"url": "https://www.gty.org/sermons/2181/the-virgin-birth", "title": "The Virgin Birth", "ref": "Matthew 1:18–25"}}, {"id": 74, "type": "mc", "q": "천하에 호적하라는 영을 내린 로마 황제는 누구인가요?", "ref": "눅 2:1–2", "p": 6, "explain": "「가이사 아구스도가 영을 내려 천하로 다 호적하라」. 이 호적은 구레뇨가 수리아 총독이 되었을 때 처음 한 것입니다(눅 2:1–2).", "bsk": "https://www.bskorea.or.kr/bible/korbibReadpage.php?version=GAE&book=luk&chap=2&sec=1", "choices": ["디베료 가이사", "네로", "글라우디오", "가이사 아구스도"], "answer": 3, "gty": {"url": "https://www.gty.org/sermons/42-22/jesus-birth-in-bethlehem-part-1", "title": "Jesus' Birth in Bethlehem, Part 1", "ref": "Luke 2:1–7"}}, {"id": 75, "type": "mc", "q": "요셉이 마리아와 함께 호적하러 올라간 곳은 어디인가요?", "ref": "눅 2:3–5", "p": 6, "explain": "모두 고향으로 갔고, 다윗의 집 족속인 요셉은 갈릴리 나사렛에서 다윗의 동네 베들레헴으로 올라갔습니다(눅 2:3–5).", "bsk": "https://www.bskorea.or.kr/bible/korbibReadpage.php?version=GAE&book=luk&chap=2&sec=1", "choices": ["예루살렘", "여리고", "베들레헴", "나사렛"], "answer": 2, "gty": {"url": "https://www.gty.org/sermons/42-22/jesus-birth-in-bethlehem-part-1", "title": "Jesus' Birth in Bethlehem, Part 1", "ref": "Luke 2:1–7"}}, {"id": 76, "type": "blank", "q": "마리아는 첫아들을 낳아 강보로 싸서 ____에 뉘었습니다.", "ref": "눅 2:6–7", "p": 6, "explain": "「이는 여관에 있을 곳이 없음이러라」(눅 2:7).", "bsk": "https://www.bskorea.or.kr/bible/korbibReadpage.php?version=GAE&book=luk&chap=2&sec=1", "choices": ["성전", "장막", "요람", "구유"], "answer": 3, "gty": {"url": "https://www.gty.org/sermons/42-22/jesus-birth-in-bethlehem-part-1", "title": "Jesus' Birth in Bethlehem, Part 1", "ref": "Luke 2:1–7"}}], "verses": 146, "key": "nt2026-day01"}</script>
<script>
(function(){
var D=JSON.parse(document.getElementById('data').textContent);
var KEY=D.key, st={};
try{st=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){st={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function el(t,c,txt){var e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e}
function link(href,txt){var a=el('a',null,txt);a.href=href;a.target='_blank';a.rel='noopener';return a}
document.getElementById('h1').textContent='📖 신약 통독 Day '+D.day+' / 54';
document.getElementById('hsub').textContent=D.date+' ('+D.weekday+') · '+D.title;
document.getElementById('intro').textContent='오늘 읽을 본문 '+D.verses+'절을 '+D.questions.length+'문항이 빠짐없이 다룹니다. 답을 고르면 바로 정답과 해설이 열립니다. 푼 결과는 이 기기에 저장됩니다.';
var TL={mc:'4지선다',blank:'빈칸',ox:'O / X'};
var qs=document.getElementById('qs'), cards=[];
var lastP=-1;
D.questions.forEach(function(q){
  if(q.p!==lastP){lastP=q.p;var P=D.passages[q.p];qs.appendChild(el('div','ph','▸ '+P.name));}
  var c=el('div','card q');c.id='q'+q.id;
  var m=el('div','meta');m.appendChild(el('span','tag','Q'+q.id));m.appendChild(el('span','tag ref',q.ref));m.appendChild(el('span','tag',TL[q.type]));c.appendChild(m);
  c.appendChild(el('p','stem',q.q));
  var o=el('div','opts'+(q.type==='ox'?' ox':''));
  var btns=q.choices.map(function(ch,i){var b=el('button',null,(q.type==='ox'?'':['①','②','③','④'][i]+' ')+ch);b.type='button';b.setAttribute('data-i',i);b.onclick=function(){answer(q,i,true)};o.appendChild(b);return b});
  c.appendChild(o);
  var ex=el('div','ex');var res=el('div','res');ex.appendChild(res);ex.appendChild(el('div',null,q.explain));
  var ul=el('ul','links');var li=el('li');li.appendChild(link(q.bsk,'개역개정 본문 보기 ('+q.ref+', 대한성서공회)'));ul.appendChild(li);
  if(q.gty){li=el('li');li.appendChild(link(q.gty.url,'John MacArthur 설교: “'+q.gty.title+'” ('+q.gty.ref+', 영어)'));ul.appendChild(li);}
  ex.appendChild(ul);c.appendChild(ex);qs.appendChild(c);
  cards.push({q:q,btns:btns,ex:ex,res:res});
});
function answer(q,i,user){
  var k=cards[q.id-1]; if(k.done)return; k.done=true;
  k.btns.forEach(function(b,j){b.disabled=true;if(j===q.answer)b.classList.add('ok');else if(j===i)b.classList.add('bad');});
  var ok=(i===q.answer);
  k.res.textContent=ok?'⭕ 정답입니다!':'❌ 아쉽습니다. 정답: '+q.choices[q.answer];k.res.className='res '+(ok?'ok':'bad');
  k.ex.classList.add('show');
  if(user){st[q.id]=i;save();}
  upd();
}
function upd(){
  var n=D.questions.length,a=0,r=0;
  cards.forEach(function(k){if(k.done){a++;if(st[k.q.id]===k.q.answer)r++;}});
  document.getElementById('bar').style.width=(100*a/n)+'%';
  document.getElementById('cnt').textContent=a+' / '+n+' 문항';
  document.getElementById('score').textContent='점수 '+r+' / '+a+(a?' ('+Math.round(100*r/a)+'%)':'');
  var f=document.getElementById('final');
  if(a===n){f.classList.add('show');document.getElementById('finaltxt').textContent=n+'문항 중 '+r+'문항을 맞히셨습니다 ('+Math.round(100*r/n)+'%). 이제 아래에서 본문을 읽어 보세요.';}
  else f.classList.remove('show');
  window.__score={answered:a,correct:r,total:n};
}
document.getElementById('reset').onclick=function(){st={};save();location.reload()};
D.questions.forEach(function(q){if(st[q.id]!=null)answer(q,st[q.id],false)});
upd();
var rd=document.getElementById('rd');
D.passages.forEach(function(P,i){
  var c=el('div','card read');c.id='p'+(i+1);c.appendChild(el('h2',null,(i+1)+'. '+P.name));
  var ul=el('ul','links');
  var li=el('li');li.appendChild(link(P.bsk,'개역개정 읽기 — 대한성서공회 ('+P.label+'이 있는 장 전체)'));ul.appendChild(li);
  li=el('li');li.appendChild(link(P.niv,'NIV (2011) 읽기 — Bible Gateway'));ul.appendChild(li);
  P.gty.forEach(function(g){li=el('li');li.appendChild(link(g.url,'John MacArthur: “'+g.title+'” ('+g.ref+')'));ul.appendChild(li);});
  c.appendChild(ul);
  var s=el('div','slot','본문 넣을 자리: 번역본을 정하시면 이곳에 '+P.label+' 전문이 들어갑니다.');s.setAttribute('data-fulltext-slot',P.b+' '+P.c+':'+P.s+'-'+P.e);c.appendChild(s);
  rd.appendChild(c);
});
})();
</script>
</body></html>
